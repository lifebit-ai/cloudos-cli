name: Receive endpoint change and generate CLI PR

on:
  # repository_dispatch:
  #   types: [endpoint-changed]
  workflow_dispatch:
    inputs:
      client_payload:
        description: "Full client_payload JSON (the object under client_payload from the dispatch body)"
        required: true
        default: '{"relevant": true, "source_pr_url": "", "changed_endpoints": [{"method": "GET", "path": "/test/mock", "change_type": "added", "auth": ["userApiToken"], "summary": "Test dispatch"}]}'
  # push:
  #   branches:
  #     - ai-server-cli

jobs:
  generate-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PR_PAT }}
          fetch-depth: 0

      - name: Resolve payload
        id: payload
        env:
          # Use env vars to safely pass user inputs — avoids single-quote injection
          # when the JSON payload contains quotes.
          CLIENT_PAYLOAD: ${{ inputs.client_payload }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Sentinel-file trigger: payload is read directly from the committed file
            cp .github/test-trigger.json /tmp/payload.json
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # workflow_dispatch receives the client_payload object as a JSON string
            # input — write it via env var (safe against single-quote injection).
            printf '%s' "$CLIENT_PAYLOAD" > /tmp/payload.json
          else
            # repository_dispatch: client_payload is already JSON — write via tojson filter
            cat <<'EOJSON' > /tmp/payload.json
          ${{ toJson(github.event.client_payload) }}
          EOJSON
          fi

      - name: Build Copilot issue body
        run: |
          python3 - <<'EOF'
          import json

          payload = json.load(open("/tmp/payload.json"))

          if not payload.get("relevant", True):
            print("Payload marked as not relevant — skipping.")
            import sys; sys.exit(0)

          endpoints = payload["changed_endpoints"]
          source_pr = payload.get("source_pr_url", "manual trigger")
          version   = open("cloudos_cli/_version.py").read().strip()

          fence = "```"
          body = (
            "## Task: implement a CloudOS API endpoint change in the CLI\n\n"
            "You are a coding agent working on the **cloudos-cli** Python package. An "
            "endpoint changed in the CloudOS API server and the CLI must be brought in "
            "sync. Follow the existing codebase conventions exactly — do not invent new "
            "patterns or directories.\n\n"
            f"**Source PR:** {source_pr}\n\n"
            "### Changed endpoint(s)\n"
            f"{fence}json\n{json.dumps(endpoints, indent=2)}\n{fence}\n\n"
            "### Change type guide\n"
            "- `added`: create a new CLI command and register it.\n"
            "- `modified`: update the existing command, its parameters and/or output "
            "handling.\n"
            "- `removed`: deprecate and delete the existing CLI command gracefully.\n"
            "- `refactored`: update internals only — keep the CLI interface identical.\n\n"
            "### Step 1 — locate the affected area\n"
            "- The CLI is **rich-click** based. The root group is defined in "
            "`cloudos_cli/__main__.py`, which imports each module's command group from "
            "its `cli.py` and registers it via `add_command()`.\n"
            "- Each feature lives in its own subdirectory under `cloudos_cli/` "
            "(e.g. `jobs/`, `workflows/`, `projects/`, `datasets/`, `queue/`). Inside "
            "each module:\n"
            "  - `cli.py` defines the Click group and command options.\n"
            "  - `<module>.py` (e.g. `jobs/job.py`) holds the logic class that performs "
            "the actual API calls.\n"
            "- Map the changed `path` to the right module using "
            "`supported-endpoints.json`: each entry has `id`, `method`, `path`, "
            "`cli_command` and `source_file`. Use `source_file` to find the exact file "
            "to edit. There is **no** `cloudos_cli/commands/` directory — do not create "
            "one.\n\n"
            "### Step 2 — follow the API-call conventions\n"
            "- Logic classes inherit from the `Cloudos` dataclass in "
            "`cloudos_cli/clos.py`, which holds `cloudos_url` and `apikey`.\n"
            "- Build requests with headers "
            "`{\"Content-type\": \"application/json\", \"apikey\": self.apikey}` and the "
            "base URL `f\"{self.cloudos_url}/api/v1/...\"` (use the API version the "
            "endpoint `path` specifies).\n"
            "- Always use the retry-aware wrappers in `cloudos_cli/utils/requests.py` "
            "(`retry_requests_get`, `retry_requests_post`, `retry_requests_put`, "
            "`retry_requests_delete`) — never call `requests` directly.\n"
            "- Raise the shared exceptions from `cloudos_cli/utils/errors.py` "
            "(e.g. `BadRequestException`, `NotAuthorisedException`) for error handling.\n"
            "- For user-facing output, reuse the table/DataFrame formatting helpers in "
            "`cloudos_cli/utils/details.py` rather than printing raw JSON.\n\n"
            "### Step 3 — apply the change consistent with the conventions above\n"
            "- Edit the module `cli.py` and its logic class to add/modify/remove the "
            "command according to the change type, matching the style of neighbouring "
            "commands (option naming, docstrings, return shapes).\n"
            "- If a new command group is introduced, register it in "
            "`cloudos_cli/__main__.py` exactly like the existing ones.\n\n"
            "### Step 4 — tests\n"
            "- Add or update tests under `tests/`, grouped by module "
            "(e.g. `tests/test_jobs/`), file names prefixed with `test_`.\n"
            "- Use `pytest`, `responses` (`@responses.activate` to mock the endpoint) "
            "and `unittest.mock`, following the pattern in existing tests such as "
            "`tests/test_jobs/test_send_job.py`. Write at least 2 unit tests covering "
            "the change.\n\n"
            "### Step 5 — bookkeeping\n"
            f"- Increment the patch version in `cloudos_cli/_version.py` (currently: "
            f"`{version}`).\n"
            "- Add a new entry at the **top** of `CHANGELOG.md`, keeping the exact "
            "existing format: a `## v<VERSION> (YYYY-MM-DD)` heading followed by the "
            "relevant category section(s) (`### Feat:`, `### Patch`, `### Breaking:`) "
            "with bulleted one-line summaries. Match the most recent entry's style.\n"
            "- Update `supported-endpoints.json` so the affected entry reflects the new "
            "`method`/`path`/`cli_command`/`source_file` (or add/remove the entry).\n"
          )

          open("/tmp/issue-body.md", "w").write(body)
          ep = endpoints[0]
          title = f"{ep['change_type']}: {ep['method']} {ep['path']}"
          open("/tmp/issue-title.txt", "w").write(title)
          EOF

      - name: Create issue and assign to Copilot coding agent
        env:
          GH_TOKEN: ${{ secrets.AGENT_PR_PAT }}
          ASSIGNEE: copilot-swe-agent
        run: |
          # switch agent: anthropic-code-agent; copilot-swe-agent; codex-code-agent?
          gh issue create \
            --title "$(cat /tmp/issue-title.txt)" \
            --body-file /tmp/issue-body.md \
            --label "agent-generated" \
            --assignee $ASSIGNEE
          echo "Issue created and assigned to $ASSIGNEE"

      - name: Open fallback issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.AGENT_PR_PAT }}
        run: |
          gh issue create \
            --title "Agent workflow failed: could not create Copilot task issue" \
            --body "The agent workflow failed. Trigger payload: $(cat /tmp/payload.json)" \
            --label "agent-failed"