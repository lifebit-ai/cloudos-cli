name: Receive endpoint change and generate CLI PR

on:
  repository_dispatch:
    types: [endpoint-changed]
  workflow_dispatch:
    inputs:
      mock_payload_json:
        description: "Full client_payload JSON (paste the mock payload)"
        required: false
        default: ''
      mock_endpoint_path:
        description: "Quick mock — endpoint path (e.g. /projects/{id}/members)"
        required: false
        default: '/projects/{id}/members'
      change_type:
        description: "added, modified, removed, or refactored"
        required: false
        default: 'added'
  push:
    branches:
      - ai-server-cli
    paths:
      - '.github/test-trigger.json'

jobs:
  generate-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PR_PAT }}
          fetch-depth: 0

      - name: Resolve payload
        id: payload
        env:
          # Use env vars to safely pass user inputs — avoids single-quote injection
          # when the JSON payload contains quotes.
          MOCK_PAYLOAD_JSON: ${{ inputs.mock_payload_json }}
          MOCK_ENDPOINT_PATH: ${{ inputs.mock_endpoint_path }}
          CHANGE_TYPE: ${{ inputs.change_type }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Sentinel-file trigger: payload is read directly from the committed file
            cp .github/test-trigger.json /tmp/payload.json
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$MOCK_PAYLOAD_JSON" ]; then
              # Write via env var — safe against single-quote injection
              printf '%s' "$MOCK_PAYLOAD_JSON" > /tmp/payload.json
            else
              python3 -c "
          import json, os
          payload = {
            'relevant': True,
            'source_pr_url': 'mock',
            'changed_endpoints': [{
              'method': 'GET',
              'path': os.environ['MOCK_ENDPOINT_PATH'],
              'change_type': os.environ['CHANGE_TYPE'],
              'auth': ['userApiToken'],
              'summary': 'Mock endpoint for testing'
            }]
          }
          print(json.dumps(payload))
          " > /tmp/payload.json
            fi
          else
            # repository_dispatch: client_payload is already JSON — write via tojson filter
            cat <<'EOJSON' > /tmp/payload.json
          ${{ toJson(github.event.client_payload) }}
          EOJSON
          fi

      - name: Build Copilot issue body
        run: |
          python3 - <<'EOF'
          import json, pathlib, textwrap

          payload   = json.load(open("/tmp/payload.json"))

          if not payload.get("relevant", True):
            print("Payload marked as not relevant — skipping.")
            import sys; sys.exit(0)

          endpoints = payload["changed_endpoints"]
          source_pr = payload.get("source_pr_url", "manual trigger")
          manifest  = json.load(open("supported-endpoints.json"))
          version   = open("cloudos_cli/_version.py").read().strip()
          changelog = open("CHANGELOG.md").read()[-1000:]

          # Filter manifest to relevant entries only
          changed_prefixes = set()
          for ep in endpoints:
            parts = ep["path"].strip("/").split("/")
            changed_prefixes.add("/".join(parts[:3]))
          relevant = [e for e in manifest["endpoints"] if any(
            e["path"].strip("/").startswith(p) for p in changed_prefixes
          )] or manifest["endpoints"][:5]

          body = f"""## API endpoint change detected

**Source PR:** {source_pr}

### Changed endpoints
```json
{json.dumps(endpoints, indent=2)}
```

### Change type guide
- `added`: create a new CLI command and register it
- `modified`: update the existing command, parameters and/or output handling
- `removed`: deprecate and delete the existing CLI command gracefully
- `refactored`: update internals only — keep the CLI interface identical

### What to implement
- Increment the patch version in `cloudos_cli/_version.py` (currently: `{version}`)
- Add a CHANGELOG entry at the top of `CHANGELOG.md` matching the existing format
- Create or modify the relevant module file under `cloudos_cli/<module>/`
  - Commands live in `cloudos_cli/clos.py` or module files like `cloudos_cli/jobs/job.py`, `cloudos_cli/datasets/datasets.py`
  - There is **no** `cloudos_cli/commands/` directory — do not create one
- Write at least 2 unit tests in `tests/` using pytest + responses + mock
- Update `supported-endpoints.json` to reflect the change

### Relevant existing manifest entries
```json
{json.dumps(relevant, indent=2)}
```

### Recent changelog (match this format exactly)
```
{changelog}
```
"""

          open("/tmp/issue-body.md", "w").write(body)
          ep = endpoints[0]
          title = f"{ep['change_type']}: {ep['method']} {ep['path']}"
          open("/tmp/issue-title.txt", "w").write(title)
          EOF

      - name: Create issue and assign to Copilot coding agent
        env:
          GH_TOKEN: ${{ secrets.AGENT_PR_PAT }}
        run: |
          ISSUE_URL=$(gh issue create \
            --title "$(cat /tmp/issue-title.txt)" \
            --body-file /tmp/issue-body.md \
            --label "agent-generated")
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -o '[0-9]*$')
          echo "Created issue #$ISSUE_NUMBER: $ISSUE_URL"

          # Assigning to @github-copilot triggers the coding agent
          gh api repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/assignees \
            -f "assignees[]=github-copilot"
          echo "Copilot agent triggered on issue #$ISSUE_NUMBER"

      - name: Open fallback issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.AGENT_PR_PAT }}
        run: |
          gh issue create \
            --title "Agent workflow failed: could not create Copilot task issue" \
            --body "The agent workflow failed. Trigger payload: $(cat /tmp/payload.json)" \
            --label "agent-failed"