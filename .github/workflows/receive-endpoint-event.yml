name: Receive endpoint change and generate CLI PR

on:
  # repository_dispatch:
  #   types: [endpoint-changed]
  workflow_dispatch:
    inputs:
      client_payload:
        description: "Full client_payload JSON (the object under client_payload from the dispatch body)"
        required: true
        default: '{"relevant": true, "source_pr_url": "", "changed_endpoints": [{"method": "GET", "path": "/test/mock", "change_type": "added", "auth": ["userApiToken"], "summary": "Test dispatch"}]}'
  # push:
  #   branches:
  #     - ai-server-cli

jobs:
  generate-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PR_PAT }}
          fetch-depth: 0

      - name: Resolve payload
        id: payload
        env:
          # Use env vars to safely pass user inputs — avoids single-quote injection
          # when the JSON payload contains quotes.
          CLIENT_PAYLOAD: ${{ inputs.client_payload }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Sentinel-file trigger: payload is read directly from the committed file
            cp .github/test-trigger.json /tmp/payload.json
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # workflow_dispatch receives the client_payload object as a JSON string
            # input — write it via env var (safe against single-quote injection).
            printf '%s' "$CLIENT_PAYLOAD" > /tmp/payload.json
          else
            # repository_dispatch: client_payload is already JSON — write via tojson filter
            cat <<'EOJSON' > /tmp/payload.json
          ${{ toJson(github.event.client_payload) }}
          EOJSON
          fi

      - name: Build Copilot issue body
        run: |
          python3 - <<'EOF'
          import json

          payload = json.load(open("/tmp/payload.json"))

          if not payload.get("relevant", True):
            print("Payload marked as not relevant — skipping.")
            import sys; sys.exit(0)

          endpoints = payload["changed_endpoints"]
          source_pr = payload.get("source_pr_url", "manual trigger")
          version   = open("cloudos_cli/_version.py").read().strip()

          fence = "```"
          body = (
            "## Sync CLI with a CloudOS API endpoint change\n\n"
            f"**Source PR:** {source_pr}\n\n"
            "### Changed endpoint(s)\n"
            f"{fence}json\n{json.dumps(endpoints, indent=2)}\n{fence}\n\n"
            "### Steps\n"
            "1. Find the file via `source_file` in `supported-endpoints.json`; CLI groups register in `cloudos_cli/__main__.py`, each module has `cli.py` (commands) + `<module>.py` (logic class extending `Cloudos` in `cloudos_cli/clos.py`).\n"
            "2. Apply the change per `change_type` (added/modified/removed/refactored), using `cloudos_cli/utils/requests.py` wrappers, `apikey` header, and matching neighbouring command style.\n"
            "3. Add ≥2 tests under `tests/<module>/` with pytest + `responses` (`@responses.activate`).\n"
            f"4. Bump patch version in `cloudos_cli/_version.py` (now `{version}`) and add a top `CHANGELOG.md` entry in the existing format.\n"
            "5. Update `supported-endpoints.json` to reflect the change.\n"
          )

          open("/tmp/issue-body.md", "w").write(body)
          ep = endpoints[0]
          title = f"{ep['change_type']}: {ep['method']} {ep['path']}"
          open("/tmp/issue-title.txt", "w").write(title)
          EOF

      - name: Create issue and assign to Copilot coding agent
        env:
          GH_TOKEN: ${{ secrets.AGENT_PR_PAT }}
          ASSIGNEE: copilot-swe-agent
        run: |
          # switch agent: anthropic-code-agent; copilot-swe-agent; codex-code-agent?
          # Create the issue first WITHOUT an assignee, then assign separately.
          ISSUE_URL=$(gh issue create \
            --title "$(cat /tmp/issue-title.txt)" \
            --body-file /tmp/issue-body.md \
            --label "agent-generated")
          echo "Created issue: $ISSUE_URL"
          ISSUE_NUMBER=$(basename "$ISSUE_URL")

          # Give GitHub a moment to fully index the new issue before assigning the
          # coding agent — assigning too quickly can fail to start the agent session.
          sleep 30

          # Retry: unassign then re-assign to nudge the agent session into starting.
          for i in 1 2 3; do
            gh issue edit "$ISSUE_NUMBER" \
              --remove-assignee "$ASSIGNEE" || true

            sleep 5

            gh issue edit "$ISSUE_NUMBER" \
              --add-assignee "$ASSIGNEE" && break

            sleep 30
          done
          echo "Issue #$ISSUE_NUMBER assigned to $ASSIGNEE"

      - name: Open fallback issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.AGENT_PR_PAT }}
        run: |
          gh issue create \
            --title "Agent workflow failed: could not create Copilot task issue" \
            --body "The agent workflow failed. Trigger payload: $(cat /tmp/payload.json)" \
            --label "agent-failed"